<!doctype html>
<html>
<head>
  <title>Open Morning</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"> 
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&family=JetBrains+Mono:wght@500&display=swap');

    /* The palette: set once, used everywhere */
    :root { --bg: #0B0C0E; --panel: rgba(255,255,255,.04); --line: rgba(169,216,240,.18); --accent: #A9D8F0; --dot: #FF2E63; }

    /* The page: black, a faint tech grid, centered */
    body { margin: 0 auto; max-width: 620px; padding: 48px 20px; min-height: 100vh; box-sizing: border-box;
      background: var(--bg); color: #fff; font-family: Poppins, sans-serif;
      background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px);
      background-size: 48px 48px; background-attachment: fixed; }

    /* The glow: two soft lights drifting behind everything */
    body::before { content: ""; position: fixed; inset: -20%; z-index: -1; pointer-events: none;
      background: radial-gradient(circle at 30% 30%, rgba(169,216,240,.22), transparent 35%),
                  radial-gradient(circle at 70% 70%, rgba(255,46,99,.14), transparent 30%);
      animation: drift 14s ease-in-out infinite alternate; }

    /* The title: shimmering ice, with a pulsing dot */
    h1 { font-size: 46px; font-weight: 800; margin: 0 0 6px; letter-spacing: -1px;
      background: linear-gradient(90deg, #fff 20%, var(--accent) 50%, #fff 80%); background-size: 200% auto;
      -webkit-background-clip: text; background-clip: text; color: transparent; animation: shimmer 6s linear infinite; }
    h1::after { content: ""; display: inline-block; width: 12px; height: 12px; margin-left: 8px; border-radius: 50%;
      background: var(--dot); box-shadow: 0 0 16px var(--dot); animation: pulse 2s ease-in-out infinite; }
    p { color: rgba(255,255,255,.65); margin: 0 0 28px; }

    /* Section labels: small, spaced, with a line that draws in */
    h2 { font-family: 'JetBrains Mono', monospace; font-size: 13px; letter-spacing: .2em; text-transform: uppercase;
      color: var(--accent); margin: 30px 0 12px; display: flex; align-items: center; gap: 12px; }
    h2::after { content: ""; flex: 1; height: 1px; background: var(--accent); opacity: .4; transform-origin: left; animation: draw 1.2s ease-out both; }

    /* The boxes: glass panels that glow when you type */
    textarea, input { width: 100%; box-sizing: border-box; background: var(--panel); color: #fff; font: inherit; font-size: 16px;
      border: 1px solid var(--line); border-radius: 14px; padding: 14px; backdrop-filter: blur(6px); transition: .3s; }
    textarea:focus, input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 4px rgba(169,216,240,.15); }

    /* Top 3: check it off and it fades out like it's done */
    label { display: flex; gap: 12px; align-items: center; margin-bottom: 10px; }
    input[type=checkbox] { width: 24px; height: 24px; flex: none; accent-color: var(--dot); cursor: pointer; }
    label:has(input:checked) input:not([type=checkbox]) { text-decoration: line-through; opacity: .45; }

    /* Everything floats up on load, one after another */
    body > * { animation: rise .8s ease-out both; }
    body > *:nth-child(2) { animation-delay: .1s; } body > *:nth-child(3) { animation-delay: .2s; }
    body > *:nth-child(4) { animation-delay: .3s; } body > *:nth-child(n+5) { animation-delay: .4s; }

    @keyframes drift { to { transform: translate(6%, -4%) rotate(8deg); } }
    @keyframes shimmer { to { background-position: 200% center; } }
    @keyframes pulse { 50% { transform: scale(1.5); opacity: .6; } }
    @keyframes draw { from { transform: scaleX(0); } }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; } }
  </style>
</head>
<body>
  <h1>Open Morning</h1>
  <p>Empty your head. Keep three. Let the rest go.</p>

  <h2>Brain dump</h2>
  <textarea rows="6" placeholder="Everything on your mind"></textarea>

  <h2>Top 3 today</h2>
  <label><input type="checkbox"> <input placeholder="One"></label>
  <label><input type="checkbox"> <input placeholder="Two"></label>
  <label><input type="checkbox"> <input placeholder="Three"></label>

  <h2>Let it go</h2>
  <textarea rows="3" placeholder="What can wait"></textarea>
</body>
</html>
