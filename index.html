<body>
  <h1>Open Morning</h1>
  <p>Empty your head. Keep three. Let the rest go.</p>

  <h2>Brain dump</h2>

  <label><input type="checkbox"> <input placeholder="Two"></label>
  <label><input type="checkbox"> <input placeholder="Three"></label>

  <h2>Let it go</h2>
  <textarea rows="3" placeholder="What can wait"></textarea>
</body>
</html>
